[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


# ══════════════════════════════════════════════════════════════════════════════
#  项目元数据与默认依赖
# ══════════════════════════════════════════════════════════════════════════════

[project]
name = "LYH_Python_Lib"
version = "0.1.0"
description = "LYH's personal Python library"
# colour-science / docling 等要求 >=3.10；实际环境是 3.13。收紧以避免
# uv 对不支持的 Python 版本求解失败。
requires-python = ">=3.10,<3.14"

dependencies = [
    "colour-science>=0.4.6",
    "google-genai>=1.47.0",
    "jieba>=0.42.1",
    "keyboard>=0.13.5",

    # ── PDF 读取相关的轻量库：仅 Windows 默认安装 ─────────────────────────
    # Linux（HPC 等）上默认不装，避免其他项目 `uv add --editable` /
    # `pip install --editable` 引用本库时拉入大量重型依赖。
    # 会连带拉入 torch 的重型 PDF 库（docling / marker-pdf）不在默认依赖里，
    # 与这里的轻量库一并收录于 [pdf] extra，任何平台都需显式启用，
    # 见 [project.optional-dependencies]。
    # 注意：markitdown 依赖 magika（基于神经网络的文件类型识别），会连带拉入
    # onnxruntime——这是 Windows 默认安装中 onnxruntime 的唯一来源；Linux 的
    # 默认安装在 chromadb 移入 [chromadb] extra 之后已不含 onnxruntime。
    "markitdown[all]>=0.1.1; sys_platform == 'win32'",   # [all] 拉回 docx/pdf/音视频等转换后端
    "pymupdf>=1.24; sys_platform == 'win32'",            # fitz — PDF 处理（Deepseek_OCR 等）
    "pypdf>=6.7.3; sys_platform == 'win32'",
    "pytesseract; sys_platform == 'win32'",              # OCR

    # ── 代码实际直接 import 的第三方顶层包（此前只手动装、未声明）─────────
    "scikit-image",            # skimage — 图像处理
    "pyexcel",                 # My_Lib_Office 读 xlsx
    "pyexcel-xlsx",            # pyexcel 的 xlsx 后端
    "opencv-python-headless",  # cv2 — 图像处理（2 处 import）
    "mcp>=2.0",                # Comp_Chem_MCP_Server / HPC_MCP_Server（mcp 2.0 API，纯 Python）
    # 纯 Python 包，运行时要求本机装有 claude CLI（订阅额度）；HPC 上无 CLI，
    # 相关模块（LLM_Lib.Literature_Research 等）已做 import 保护
    "claude-agent-sdk>=0.1.0",
    "tomli>=2; python_version < '3.11'",   # HPC_xTB_Task 读 xtb_task.toml（3.11+ 用标准库 tomllib）
    "pyperclip>=1.11.0",
    "PyQt6<=6.9.1; sys_platform == 'win32'",
    "qdrant-client>=1.16.0",

    # ── RAG 管线手动装过、需纳入以免 uv sync 卸载 ─────────────────────────
    "ranx>=0.3",               # 检索评估指标
    "paramiko>=3",             # HPC SFTP 回收
    "pyarrow; sys_platform == 'win32'",
    "pyarrow<=20.0.0; sys_platform != 'win32'",
    "rank-bm25>=0.2.2",
    # torch 以及所有会连带拉入 torch 的重型库（FlagEmbedding /
    # sentence-transformers / peft / docling / marker-pdf）都不在默认依赖里：
    # torch 体积巨大而只有少数模块用到，只在用户明确说明需要时经 extras 启用——
    #   [torch] —— torch + torchvision（Machine_Learning_Lib、直接用 torch 的代码）
    #   [rag]   —— RAG 嵌入 / 重排栈（连带拉入 torch）
    #   [pdf]   —— PDF 转换识别栈（docling / marker-pdf 连带拉入 torch）
    # torch 的下载源按平台在 [tool.uv.sources] 区分：Windows 用 CUDA(cu128)，
    # 非 Windows(HPC Linux 等)用 CPU wheel；该机制只对本仓库自身的 uv sync
    # 生效，不会传导给 `uv add --editable` 引用本库的下游项目。
    # >=4.47 支持 Docling 的 RT-DETRv2 版面模型；FlagEmbedding/BGE-M3 只要求
    # >=4.44.2（无上限），故升级不影响。<5 避开 transformers 5.x 大版本风险。
    "transformers>=4.47,<5",

    # ── 平台特定 ──────────────────────────────────────────────────────────
    "pywin32>=311; sys_platform == 'win32'",
    "send2trash",
]


# ══════════════════════════════════════════════════════════════════════════════
#  Extras（按需启用的重型 / 遗留 / 平台特定依赖）
# ══════════════════════════════════════════════════════════════════════════════
# 其中 modern / legacy 为平台新旧二选一（互斥，见 [tool.uv] conflicts）。
# 背景：不少编译型包的新版本只发 glibc >= 2.27/2.28 的 manylinux wheel，老 glibc
# 的 HPC（CentOS 7 系 = glibc 2.17，即 uv 报错里的 manylinux_2_17_x86_64）装不上，
# 且这类包多数没有 sdist（或有 sdist 但在 HPC 上现场编译必失败）。
# 用法：
#   * 新平台（glibc >= 2.28：Rocky/Alma 8+、Ubuntu 20.04+、Windows）：照常
#     `uv sync`，解析到各包最新版本，不需要任何 extra。
#   * 老 glibc 的 Linux（登录节点 `getconf GNU_LIBC_VERSION` < 2.28）：改跑仓库
#     根目录的 `bash uv_sync_old_glibc.sh`，内部执行 `uv sync --extra legacy`
#     并跳过完全无法安装的包。两种平台共用同一份 uv.lock。
#
# RAG 索引 / 检索的完整安装：`uv sync --extra torch --extra rag`
# （老 glibc HPC 用 `bash uv_sync_old_glibc.sh --extra rag`，legacy 本身已含 torch）。

[project.optional-dependencies]

# PDF 读取 / 识别相关库。轻量部分（markitdown / pymupdf / pypdf / pytesseract）
# 在 Windows 上已是默认依赖；docling / marker-pdf 因为会连带拉入 torch，
# 只存在于本 extra 中，任何平台都要显式启用：
# `uv sync --extra pdf` 或 `pip install -e ".[pdf]"`。
# 老 glibc 机器上与 legacy 组合使用：`bash uv_sync_old_glibc.sh --extra pdf`。
pdf = [
    "markitdown[all]>=0.1.1",
    "pymupdf>=1.24",
    "pypdf>=6.7.3",
    "pytesseract",
    "docling>=2.100",          # 拉 docling-core / docling-ibm-models / rapidocr 等，连带 torch
    "marker-pdf>=1.0",         # Marker + Surya OCR：Lit_Retrieval_5_PDF_to_Markdown.py 依赖，连带 torch
]

# torch 本体。默认不装（体积巨大、只有少数模块用到），用户明确说明需要时启用：
# `uv sync --extra torch` 或 `uv add --editable "<路径>/Python_Lib[torch]"`。
# torchvision 的 ABI 必须与 torch 匹配，两者在 [tool.uv.sources] 里同源。
# 版本约束不写在这里，而是放在下方 modern / legacy extras 里：老 glibc 的
# HPC 装不上新版 torch（wheel 要求 glibc >= 2.28）。
torch = [
    "torch",
    "torchvision",
]

# LLM_Lib RAG 的嵌入 / 重排栈（BGE-M3、reranker），会连带拉入 torch。
# datasets / fsspec 的精确 pin 是 FlagEmbedding 1.3.5 的兼容性要求。
# chromadb —— 旧版 RAG 向量库，现行管线已迁移到 Qdrant + Parquet；仅
# RAG.py 中的读取 / 迁移入口（load_chromadb_collection 等）还需要它，
# 逻辑上属于 RAG 栈，与其他依赖一同经 [rag] 启用。默认安装（不含 rag）
# 不再拉入 chromadb，也就不再连带 onnxruntime。
rag = [
    "chromadb>=0.5.23",
    "FlagEmbedding==1.3.5",
    "datasets==3.2.0",
    "fsspec==2024.9.0",
    "peft>=0.5.0",
    "sentence-transformers>=2.6.0",
]

# 强制新版下限。平常不用显式启用（默认解析本来就取最新）；存在的意义是与
# legacy 构成 uv 的互斥 fork 声明，以及下游项目想强制新版时可用 [modern]。
# 注意：torch 移出默认依赖后，启用 [modern] 本身就会装上 torch。
modern = [
    "torch>=2.10",
    "torchvision>=0.25",
]

# 老 glibc（2.17）Linux 上各包仍能安装的最高版本（2026-07 以
# `uv pip compile --python-platform x86_64-manylinux_2_17` 探测）。
# 写上限而不是精确 pin，允许求解器在个别 Python 版本分支上取更低版本。
# 注意：torch 移出默认依赖后，legacy 仍显式带 torch / torchvision——老 glibc
# HPC 上的转换 / 索引管线需要 torch，装 legacy 即装 torch（CPU 版）。
legacy = [
    "torch<2.7; sys_platform == 'linux'",       # torch 2.7 起 CPU wheel 只发 manylinux_2_28
    "torchvision<0.22; sys_platform == 'linux'",
    "numpy<=2.2.6; sys_platform == 'linux'",
    "scipy<=1.16.3; sys_platform == 'linux'",
    "pandas<=2.3.2; sys_platform == 'linux'",
    "pillow<=12.2.0; sys_platform == 'linux'",
    "scikit-image<=0.25.2; sys_platform == 'linux'",
    "scikit-learn<=1.7.2; sys_platform == 'linux'",
    "contourpy<=1.3.2; sys_platform == 'linux'",
    "pymupdf<=1.26.0; sys_platform == 'linux'",
    "rtree<=1.4.0; sys_platform == 'linux'",
    "cbor2<=5.9.0; sys_platform == 'linux'",
    # sentencepiece 只有 <=0.2.0 发过 glibc 2.17 wheel，且该版本没有 Python 3.13
    # 的包；3.13 环境下由 uv_sync_old_glibc.sh 跳过安装
    "sentencepiece<=0.2.0; sys_platform == 'linux' and python_full_version < '3.13'",
    # 以下包在旧 glibc 上任何版本都无解，统一由 uv_sync_old_glibc.sh 跳过安装：
    #   PyQt6 / PyQt6-Qt6 / PyQt6-sip —— Qt6 官方二进制要求 glibc >= 2.28；
    #   onnxruntime —— 有 Python 3.11+ wheel 的版本均要求 glibc >= 2.27
    #     （经 [pdf] 的 markitdown→magika 或 [chromadb] 引入时才会出现）；
    #   docling-parse —— 仅 Python 3.10 有 glibc 2.17 wheel（3.11+ 跳过）。
]

[dependency-groups]
# 开发/测试工具，不进运行时依赖（uv sync 默认装 dev 组；生产可 --no-dev）
dev = ["pytest", "pip"]


# ══════════════════════════════════════════════════════════════════════════════
#  setuptools 打包配置
# ══════════════════════════════════════════════════════════════════════════════

[tool.setuptools]
# 1. Define the package name explicitly as "Python_Lib"
# 注意：setuptools 的显式 packages 列表不会自动包含子包，每个子包都要单独列出，
# 否则构建 wheel / strict 模式的可编辑安装时子包会被漏掉（普通可编辑安装只是把
# src 加进 sys.path，暴露不出这个问题）。新增子包时必须同步补进这里。
packages = [
    "Python_Lib",
    "LLM_Lib",
    "LLM_Lib.Literature_Research",
    "LLM_Lib.RAG_Lib",
    "Chem_Lib",
    "Machine_Learning_Lib",
    "HPC_Lib",
    "Tools",
]
# 2. Enable inclusion of non-code files (like .txt or .dll)
include-package-data = true

[tool.setuptools.package-dir]
# 3. CRITICAL: Map the "Python_Lib" package to the current directory (".")
# This transforms "My_Lib.py" into "Python_Lib.My_Lib"
Python_Lib = "src/Python_Lib"
Machine_Learning_Lib = "src/Machine_Learning_Lib"
Chem_Lib = "src/Chem_Lib"
LLM_Lib = "src/LLM_Lib"
HPC_Lib = "src/HPC_Lib"
Tools = "src/Tools"

[tool.setuptools.package-data]
# If you have non-python files (dlls, txts) in the root, include them here:
Python_Lib = [
    "phantomjs.exe",
]
# Literature_Research 驱动器按 __file__ 相对路径读取各角色提示词
"LLM_Lib.Literature_Research" = [
    "prompts/*.md",
]
Chem_Lib = [
    # ── PyQt6 界面文件 ──
    "UI/*.py",
    "UI/*.ui",
    "UI/*.txt",

    # ── glfw / mogli（分子显示）──
    "glfw/glfw3.lib",
    "glfw/glfw3dll.lib",
    "glfw/(Broken) show_molecule.py",
    "glfw/__init__.py",
    "glfw/glfw3.dll",
    "mogli/glfw3.dll",
    "mogli/glfw3.lib",
