    "OpenBabel-2.3.2/plugin_descriptors.obf",
    "OpenBabel-2.3.2/plugin_fingerprints.obf",
    "OpenBabel-2.3.2/plugin_forcefields.obf",
    "OpenBabel-2.3.2/plugin_ops.obf",
    "OpenBabel-2.3.2/sdf.bat",
    "OpenBabel-2.3.2/Uninstall.exe",
    "OpenBabel-2.3.2/xdr-0.dll",
