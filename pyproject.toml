# ══════════════════════════════════════════════════════════════════════════════
#  uv 专属配置
# ══════════════════════════════════════════════════════════════════════════════

# modern / legacy extras 互斥：让 uv 对两种组合分别 fork 求解，
# 同一份 uv.lock 里同时锁定「新平台最新版」与「老 glibc 回退版」两套结果。
# 不声明 conflicts 的话，legacy 的上限会污染默认解析，把所有平台都拖到旧版本。
[tool.uv]
conflicts = [
    [{ extra = "modern" }, { extra = "legacy" }],
]

# claude-agent-sdk 钉死 mcp<2.0.0，但本仓库两个 MCP server（Comp_Chem_MCP_Server、
# HPC_MCP_Server）用的是 mcp 2.0 API，降到 1.x 会直接 ImportError。实测
# （2026-08-08）claude-agent-sdk 运行时只从 mcp.types 导入四个协议类型
# （CallToolRequest / CallToolRequestParams / ListToolsRequest / ToolAnnotations），
# mcp 2.0 全部保留；其 mcp.server 导入要么在 TYPE_CHECKING 后面、要么在
# create_sdk_mcp_server 的懒加载里（mcp 2.0 的 mcp.server 也仍导出 Server）。
# 因此强制覆盖它的钉子，让全仓库统一用 mcp 2.0。若未来升级 claude-agent-sdk
# 后出现 mcp 相关报错，先重查这一条 override 是否仍然安全。
override-dependencies = [
    "mcp>=2.0",
]

# ── PyTorch 来源：按平台自动选 CUDA / CPU ───────────────────────────────
# Windows(本机 RTX 5080)用 CUDA 12.8 wheel；非 Windows(HPC Linux CPU 节点等)
# 用 CPU wheel。torch 默认不装；启用 [torch] / [rag] / [pdf] / legacy 等会
# 引入 torch 的 extra 时，同一份 pyproject 在两类平台都装到合适的 torch。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
